name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The engine shells out to these; the tests drive the real CLI.
      - name: Install the tools it uses
        run: sudo apt-get update && sudo apt-get install -y rsync inotify-tools git

      - name: Compile the CLI
        run: python3 -m py_compile bin/configsync

      - name: Run the end-to-end tests
        run: python3 -m unittest discover -s tests -v
